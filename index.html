* {

}
body {

}
button,
input,
select {

}
button {

  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
a:focus-visible {
  outline: 3px solid #009db2;
  outline-offset: 3px;
}
button {
  border: 0;
  background: none;
}
button:active {
  opacity: 0.7;

}
.app {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  min-height: 440px;
  margin: auto;
  background: white;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 50px #00344415;
}
.demo-bar {
  background: #003444;
  color: #fff;
  text-align: center;
  font-size: 12px;
  letter-spacing: 1.3px;
  padding: 5px 0;
  flex-shrink: 0;
  font-weight: 800;
}
header {
  height: 66px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
  background: white;
  z-index: 2;
}
header h1 {
  font-size: 18px;
  margin: 0;
  font-weight: 800;
}
header .left,
header .right {
  position: absolute;
  top: 12px;
  min-width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
}
header .left {
  left: 8px;
}
header .right {
  right: 8px;
}
.icon {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 800;
}
.mark {
  width: 30px;
  height: 30px;
  display: grid;
  grid-template-columns: repeat(2, 10px);
  grid-template-rows: repeat(2, 10px);
  gap: 2px;
  transform: rotate(45deg);
  align-content: center;
  justify-content: center;
}
.mark i {
  background: #85d0cc;
}
.mark i:nth-child(2) {
  background: #3c9dac;
}
.mark i:nth-child(3) {
  background: #b9e4df;
}
main {
  flex: 1;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding-bottom: 18px;
}
main::-webkit-scrollbar {
  display: none;
}
main.animate {
  animation: slide 0.28s cubic-bezier(0.2, 0.75, 0.2, 1);
}
@keyframes slide {
  from {
    opacity: 0.3;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
nav {
  height: 76px;

}
nav button {
  flex: 1;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 9px 0;
}
nav button.active {
  color: var(--teal);
}
.section-title {
  font-size: 16px;
  font-weight: 800;
  padding: 8px 18px 15px;
}
.band {
  background: #f1f1f5;
  padding: 9px 18px;
  font-size: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  font-weight: 800;

  height: 22px;

.account {

  align-items: center;
  gap: 5px;

.account > div:first-child {

}
.account-name {
  font-weight: 700;

}
.meta {

.money-side {

.chevron {

}
.vault-row {

  align-items: center;

}
.text-link {
  color: #137080;
  font-size: 13px;
  font-weight: 700;
}
.open-area {
  text-align: center;
  padding: 24px 18px;
}
.open-area p {
  font-size: 14px;
  color: #60636a;
}
.btn {
  display: block;
  width: 100%;
  border-radius: 2px;
  padding: 12px 16px;
  background: var(--mint);
  font-weight: 700;
  font-size: 15px;
  min-height: 46px;
}
.btn.outline {
  border: 1px solid #54727c;
  background: white;
}
.btn.danger {
  color: #b02b37;
  background: #fff0f1;
}
.btn:disabled {
  opacity: 0.4;
  cursor: default;
}
.detail-head {
  padding: 5px 20px 23px;
  box-shadow: 0 5px 6px #0002;
  border-radius: 0 0 18px 18px;
  position: relative;
  background: linear-gradient(133deg, white 73%, #eef7f7 73.3%, white 73.8%);
}
.detail-head h2 {
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 5px 0 20px;
}
.detail-head h2 .icon {
  color: #6bb5bc;
}
.detail-summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}
.tabs {
  display: flex;
  margin-top: 18px;
  background: #f3f2f6;
  padding: 0 5px;
}
.tabs button {
  flex: 1;
  padding: 15px 4px;
  font-size: 13px;
  border-bottom: 3px solid transparent;
  color: #5e6570;
}
.tabs .selected {
  border-color: var(--teal);
  font-weight: 800;
  color: #39414c;
}
.tabs .search-btn {
  flex: 0 0 44px;
}
.date-band {
  padding: 8px 17px;
  font-weight: 800;
  font-size: 12px;
  background: #fafafa;
}
.transaction {
  width: 100%;
  display: flex;
  align-items: center;
  padding: 12px 15px;
  gap: 11px;
  text-align: left;
  border-bottom: 1px solid #f4f3f5;
  min-height: 87px;
}
.transaction .icon {
  width: 22px;
  color: #8b9196;
}
.tx-body {
  flex: 1;
  min-width: 0;
}
.tx-title {
  font-size: 14px;
  font-weight: 700;
}
.tx-description {
  font-size: 12px;
  color: #666;
  overflow-wrap: anywhere;
}
.tx-value {
  text-align: right;
  min-width: 84px;
}
.tx-value strong {
  font-size: 14px;
  font-weight: 600;
}
.credit {
  background: #e6f6f3;
  color: #26766e;
  border-radius: 3px;
  padding: 1px 5px;
}
.tx-value .meta {
  font-size: 11px;
  margin-top: 12px;
}
.tx-value .chevron {
  margin-left: 5px;
}
.search-field {
  padding: 10px 18px;
}
.field {
  display: block;
  margin-bottom: 17px;
  font-size: 14px;
  font-weight: 700;
}
.field input,
.field select,
.search-field input {
  width: 100%;
  display: block;
  border: 1px solid #d5dcdf;
  border-radius: 5px;
  padding: 12px;
  background: white;
  color: #003444;
  margin-top: 7px;
  min-height: 46px;
}
.field input:focus,
.field select:focus {
  outline: 2px solid #009db2;
}
.pad {
  padding: 20px;
}
.card-hero {
  text-align: center;
  padding: 32px 18px 22px;
}
.bank-card {
  padding: 0;
  margin: 0 auto 23px;
  border-radius: 7px;
  display: block;
  touch-action: manipulation;
}
.bank-card img {
  display: block;
  width: 176px;
  border-radius: 6px;
  box-shadow: 0 5px 11px #0002;
}
.card-account {
  font-size: 14px;
  font-weight: 700;
}
.info-table {
  border: 1px solid #dddfe6;
  margin: 0 18px;

  overflow: hidden;
}
.info-row {

  padding: 10px 7px;
  font-size: 14px;
  gap: 10px;
}
.info-row:nth-child(odd) {
  background: #f3f3f6;
}
.info-row span:last-child {
  text-align: right;
  color: #424b58;
}
.info-row strong {
  font-size: 14px;
}
.card-spacer {
  height: clamp(30px, 9vh, 100px);
}
.wallet {
  border-top: 4px solid #e1e1e7;
  border-bottom: 1px solid var(--line);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 15px;
}
.wallet .check {
  margin-left: auto;
  color: var(--teal);
  font-weight: 800;
}
.label {
  font-size: 14px;
  font-weight: 800;
  color: #78828f;
  padding: 17px 20px 8px;
}
.list-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);

}
.list-row > div {
  flex: 1;
}
.list-row strong {

  font-size: 13px;

.list-row > .icon {
  color: #939ba7;
  width: 22px;
}
.list-row .chevron {
  margin-left: auto;
}
.switch {
  width: 68px;
  height: 30px;
  border-radius: 20px;
  background: #dfe0e4;
  display: flex;
  align-items: center;
  font-size: 11px;
  color: #54616b;
  padding: 4px;
  gap: 8px;
}
.switch:before {
  content: "";
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 1px 3px #0001;
}
.switch.on {
  background: #85d0cb;
}
.screen-bottom {
  padding: 20px;
  margin-top: auto;
}
.form-screen {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.form-screen > .pad {
  flex: 1;
}
.two-buttons {
  display: flex;
  gap: 12px;
}
.two-buttons .btn:first-child {
  flex: 1;
}
.two-buttons .btn:last-child {
  flex: 2;
}
.transfer-block {
  padding: 17px;
  border-top: 4px solid #e1e1e7;
  border-bottom: 1px solid #e1e1e7;
}
.transfer-block .caps {
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 9px;
}
.transfer-block select {
  width: 100%;
  border: 0;
  background: white;
  color: #003444;
  font-size: 15px;
  font-weight: 700;
  padding: 8px 0;
}
.empty {
  text-align: center;
  padding: 55px 25px;
  color: #74808a;
  font-size: 15px;
}
.menu-shade,
.sheet-shade {
  position: absolute;
  inset: 26px 0 0;
  background: #0008;
  z-index: 10;
  animation: fade 0.2s;
}
.drawer {
  height: 100%;
  width: 89%;
  background: #fff;
  padding: 16px 16px 25px;
  overflow: auto;
  animation: drawer 0.27s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.drawer-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  font-size: 16px;
}
.drawer .list-row {

}
.drawer .list-row .icon {

}
.drawer .btn {
  margin-top: 24px;
}
.drawer .meta {
  text-align: center;
  margin-top: 10px;
  font-size: 11px;
}
.sheet-shade {
  display: flex;
  align-items: flex-end;
}
.sheet {
  width: 100%;
  max-height: 91%;
  overflow: auto;
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 18px 20px 25px;
  animation: up 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 -6px 30px #0001;
}
.sheet:before {
  content: "";
  display: block;
  width: 36px;
  height: 4px;
  border-radius: 3px;
  background: #d3dbde;
  margin: 0 auto 14px;
}
.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.sheet h2 {
  font-size: 19px;
  margin: 0;
}
.close {
  width: 36px;
  height: 36px;
  font-size: 24px;
}
.sheet p {
  font-size: 14px;
  color: #63717a;
}
.sheet .list-row {
  padding: 15px 0;
}
.sheet .field {
  margin-bottom: 14px;
}
.sheet-note {
  background: #eaf6f5;
  padding: 10px 12px;
  border-radius: 5px;
  font-size: 13px;
  color: #386468;
  margin: 0 0 18px;
}
#toast {
  position: absolute;
  bottom: 88px;
  left: 20px;
  right: 20px;
  background: #003444;
  color: #fff;
  border-radius: 8px;
  padding: 13px 15px;
  font-size: 14px;
  z-index: 30;
  opacity: 0;
  transform: translateY(15px);
  pointer-events: none;
  transition: 0.2s;
}
#toast.show {
  opacity: 1;
  transform: translateY(0);
}
.big-value {
  font-size: 34px;
  text-align: center;
  padding: 20px 0;
  font-weight: 700;
}
.detail-list .info-row {
  padding: 16px 0;
  border-bottom: 1px solid #eee;
  background: white;
}
.pill {
  display: inline-block;
  background: #e7f5f2;
  color: #287970;
  padding: 5px 9px;
  font-size: 12px;
  border-radius: 5px;
}
.loan-card {
  margin: 20px 0;
  border: 1px solid #ddd;
  border-top: 3px solid #009db2;
  border-radius: 7px;
  padding: 18px;
}
.loan-card h2 {
  font-size: 22px;
  margin: 0;
}
.loan-card p {
  font-size: 14px;
  color: #777;
}
.rates {
  display: flex;
  gap: 30px;
}
.rates strong {
  font-size: 30px;
  display: block;
}
.rates span {
  font-size: 12px;
  color: #777;
}
.vault {
  text-align: center;
  padding: 35px 24px;
}
.vault h2 {
  font-size: 24px;
}
.vault > .icon {
  width: 65px;
  height: 65px;
  color: #73b9bf;
  margin: 30px;
}
.vault p {
  font-size: 15px;
  color: #6d7780;
  line-height: 1.6;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes drawer {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(0);
  }
}
@keyframes up {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}
@media (min-width: 600px) and (hover: hover) and (pointer: fine) {
  body {
    padding: 20px;
  }
  .app {
    height: calc(100dvh - 40px);
    max-height: 900px;
    border-radius: 22px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

    `<p class="sheet-note">These fictional details are saved on this device. No photo is used.</p><form id="profile-form">${field("Card holder name", "name", state.name, "text", 'required maxlength="60"')}${field("Sample card number (masked)", "cardNumber", maskedCard(), "text", 'required pattern="[0-9]{6}[xX]{6}[0-9]{4}" maxlength="16" title="Six digits, six X characters, then four digits"')}${field("Age", "age", state.age, "number", 'required min="1" max="120"')}${field("Email", "email", state.email, "email", 'maxlength="100"')}${field("Mobile", "phone", state.phone, "tel", 'maxlength="24"')}${state.accounts.map((a, i) => `<fieldset class="account-editor"><legend>${escape(a.name)}</legend>${field("Sample account number", `account${i}`, a.number, "text", 'required inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12"')}${field("Sample BSB (6 digits)", `bsb${i}`, a.bsb, "text", 'required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6"')}${field("Available sample balance", `balance${i}`, balance(a), "number", 'required step="0.01" min="-10000000" max="10000000"')}</fieldset>`).join("")}<button class="btn">Save demo details</button></form>`,
  );
}
function transactionEditor(t) {
  sheet(
    t ? "Edit transaction" : "Add transaction",
    `<form id="tx-form" data-id="${escape(t?.id || "")}">${field("Date", "date", t?.date || localDay(), "date", "required")}${field("Transaction type", "title", t?.title || "Card Purchase", "text", 'required maxlength="60"')}${field("Description", "description", t?.description || "", "text", 'required maxlength="150"')}${field("Amount (negative for money out)", "amount", t?.amount ?? "", "number", 'required step="0.01" min="-10000000" max="10000000"')}${field("Category", "category", t?.category || "Shopping", "text", 'required maxlength="50"')}<label class="field">Status<select name="status"><option ${t?.status !== "Pending" ? "selected" : ""}>Processed</option><option ${t?.status === "Pending" ? "selected" : ""}>Pending</option></select></label>${field("Sample payer name", "payer", t?.payer || "Sample sender", "text", 'maxlength="80"')}<button class="btn">Save transaction</button>${t ? '<button type="button" class="btn danger" style="margin-top:12px" data-action="deletetx">Delete transaction</button>' : ""}</form>`,
  );
}
function payments() {
  sheet(
    "Payments & Transfers",
    `<p>What would you like to do?</p>${row("Transfer", "Between my accounts", "transfer", "transfer")}${row("Pay anyone", "Outside of my accounts", "pay", "payees")}${row("BPAY", "Pay a bill", "wallet", "bpay")}`,
  );
}
function info(title, message) {
  sheet(title, `<p>${message}</p><button class="btn" data-action="close">Done</button>`);
}
let stagedTransfer = null;
document.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-tx-amount]");
  if (hit) {
    selectedTx = hit.dataset.txAmount;
    triple("tx-" + selectedTx, () =>
      transactionEditor(state.transactions.find((t) => t.id === selectedTx)),
    );
    return;
  }
  if (e.target.matches("[data-backdrop]")) return closeOverlay();
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.account) {
    accountId = b.dataset.account;
    filter = "ALL";
    return go("detail");
  }
  if (b.dataset.tx) {
    selectedTx = b.dataset.tx;
    return go("tx");
  }
  if (b.dataset.filter) {
    filter = b.dataset.filter;
    visibleTransactions = 5;
    return render();
  }
  if (b.dataset.product) {
    product = b.dataset.product;
    return go("loan");
  }
  const a = b.dataset.action;
  if (!a) return;
  if (a.startsWith("nav-")) {
    const p = a.slice(4);
    return p === "pay" ? payments() : go(p);
  }
  if (a.startsWith("payee-"))
    return info(
      "Demo payment",
      "Payments to other people are not sent from this prototype. You can add a sample payment with the transaction editor.",
    );
  switch (a) {
    case "load-more":
      loadMoreTransactions();
      break;
    case "menu":
      menu();
      break;
    case "settings":
      menu(true);
      break;
    case "close":
      closeOverlay();
      break;
    case "back":
      go(page === "tx" ? "detail" : page === "loan" ? "products" : "accounts");
      break;
    case "search":
      searching = !searching;
      render();
      $("#search")?.focus();
      break;
    case "payments":
      payments();
      break;
    case "transfer":
    case "payees":
    case "personal":
    case "vault":
      go(a);
      break;
    case "card-tap":
      triple("card", profileEditor);
      break;
    case "amount-tap":
      triple("tx-" + selectedTx, () =>
        transactionEditor(state.transactions.find((t) => t.id === selectedTx)),
      );
      break;
    case "logout":
      go("login");
      break;
    case "share-demo":
      shareDemo();
      break;
    case "profile":
      profileEditor();
      break;
    case "lock":
      state.locked = !state.locked;
      save();
      render();
      toast(state.locked ? "Demo card locked" : "Demo card unlocked");
      break;
    case "addtx":
      transactionEditor();
      break;
    case "edittx":
      transactionEditor(state.transactions.find((t) => t.id === selectedTx));
      break;
    case "deletetx":
      sheet(
        "Delete transaction?",
        `<p>This will remove the sample transaction and update your demo balance.</p><button class="btn danger" data-action="confirm-delete">Delete transaction</button><button class="btn outline" style="margin-top:10px" data-action="close">Cancel</button>`,
      );
      break;
    case "confirm-delete":
      state.transactions = state.transactions.filter((t) => t.id !== selectedTx);
      save();
      go("detail");
      toast("Transaction deleted");
      break;
    case "confirm-transfer":
      if (stagedTransfer) {
        state.transactions.push(...stagedTransfer);
        save();
        stagedTransfer = null;
        go("accounts");
        toast("Demo transfer complete");
      }
      break;
    case "addpayee":
      sheet(
        "Add new payee",
        `<form id="payee-form">${field("Name", "name", "", "text", 'required maxlength="60"')}${field("Sample BSB", "bsb", "000000", "text", 'required pattern="[0-9]{6}"')}${field("Sample account number", "number", "", "text", 'required pattern="[0-9]{4,12}"')}<button class="btn">Save sample payee</button></form>`,
      );
      break;
    case "pin":
      info(
        "Set PIN",
        "PIN changes are simulated in this demo. No bank PIN is requested or stored.",
      );
      break;
    case "lost":
      info(
        "Report lost or stolen card",
        "This is a demo card. No real card can be cancelled here.",
      );
      break;
    case "password":
    case "faceid":
      info(
        a === "password" ? "Change password" : "Face ID",
        "Authentication is not connected in this prototype.",
      );
      break;
    case "bpay":
      info(
        "BPAY",
        "Bill payments are not sent from this demo. Use editable sample transactions to model a payment.",
      );
      break;
    case "sharing":
      info(
        "Data sharing",
        "Your sample edits are stored only in this browser. Nothing is sent to a bank.",
      );
      break;
    case "contact":
    case "information":
    case "feedback":
    case "faq":
      info(
        "About this demo",
        "An independent interactive prototype based on your reference recording. Triple-tap the card to edit the sample profile. Triple-tap any transaction amount to edit it.",
      );
      break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "search") {
    query = e.target.value;
    visibleTransactions = 5;
    $("#transactions").innerHTML = txList();
  }
  if (["price", "deposit"].includes(e.target.id)) {
    const p = Number($("#price").value),
      d = Number($("#deposit").value),
      r = 0.0604 / 12;
    const v = (Math.max(0, p - d) * r) / (1 - Math.pow(1 + r, -360));
    $("#repayment").innerHTML = `${money(v)} <small style="font-size:14px">Monthly</small>`;
  }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));
  if (f.id === "login-form") {
    if (d.passcode === "3012") {
      go("accounts");
    } else {
      $("#login-error").textContent = "Incorrect passcode. Please try again.";
      $("#passcode").value = "";
      $("#passcode").focus();
    }
    return;
  }
  if (f.id === "profile-form") {
    if (!d.name.trim()) return toast("Enter a sample name");
    state.cardNumber = d.cardNumber.toUpperCase();
    state.name = d.name.trim();
    state.age = Number(d.age);
    state.email = d.email;
    state.phone = d.phone;
    state.accounts.forEach((a, i) => {
      a.number = d[`account${i}`];
      a.bsb = d[`bsb${i}`];
      const txTotal = state.transactions
        .filter((t) => t.account === a.id)
        .reduce((total, t) => total + t.amount, 0);
      a.opening = Math.round((Number(d[`balance${i}`]) - txTotal) * 100) / 100;
    });
    save();
    closeOverlay();
    render();
    toast("Demo details saved");
  }
  if (f.id === "tx-form") {
    const val = Number(d.amount);
    if (!Number.isFinite(val) || val === 0) return toast("Enter a non-zero amount");
    const previous = state.transactions.find((x) => x.id === f.dataset.id);
    const t = {
      ...d,
      ...(previous && previous.date === d.date && Number.isInteger(previous.dayOffset)
        ? { dayOffset: previous.dayOffset }
        : {}),
      amount: Math.round(val * 100) / 100,
      account: accountId,
      id: f.dataset.id || sampleId(),
    };
    const idx = state.transactions.findIndex((x) => x.id === t.id);
    if (idx >= 0) state.transactions[idx] = t;
    else state.transactions.push(t);
    save();
    closeOverlay();
    render();
    toast("Transaction saved");
  }
  if (f.id === "payee-form") {
    state.payees.push(d);
    save();
    closeOverlay();
    render();
    toast("Sample payee saved");
  }
  if (f.id === "transfer-form") {
    const n = Number(d.amount),
      from = state.accounts.find((a) => a.id === d.from),
      to = state.accounts.find((a) => a.id === d.to);
    if (from === to) return toast("Choose two different accounts");
    if (!Number.isFinite(n) || n <= 0) return toast("Enter a valid amount");
    if (n > balance(from)) return toast("Not enough sample funds");
    const date = localDay();
    stagedTransfer = [
      {
        id: sampleId(),
        account: from.id,
        date,
        title: "Funds Transfer",
        description: d.description || `To: ${to.name}`,
        amount: -n,
        category: "Transfer",
      },
      {
        id: sampleId(),
        account: to.id,
        date,
        title: "Funds Transfer",
        description: d.description || `From: ${from.name}`,
        amount: n,
        category: "Transfer",
      },
    ];
    sheet(
      "Confirm demo transfer",
      `<div class="big-value">${money(n)}</div><p>From ${escape(from.name)}<br>To ${escape(to.name)}</p><p class="sheet-note">Only your sample balances will change.</p><button class="btn" data-action="confirm-transfer">Confirm transfer</button>`,
    );
  }
});
document.addEventListener("keydown", (e) => {
  const hit = e.target.closest("[data-tx-amount]");
  if (hit && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    selectedTx = hit.dataset.txAmount;
    transactionEditor(state.transactions.find((t) => t.id === selectedTx));
    return;
  }
  if (!$("#overlay").firstElementChild) return;
  if (e.key === "Escape") {
    closeOverlay();
    return;
  }
  if (e.key === "Tab") {
    const fs = [...$("#overlay").querySelectorAll("button,input,select")],
      first = fs[0],
      last = fs.at(-1);
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last?.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first?.focus();
    }
  }
});
async function shareDemo() {
  const t = state.transactions.find((x) => x.id === selectedTx);
  const text = `DEMO — FICTIONAL TRANSACTION\n${t.title}\n${amount(t.amount)}\n${t.date}\n${t.description}\nNot a bank record or proof of payment.`;
  try {
    if (navigator.share) {
      await navigator.share({ title: "Demo transaction", text });
    } else {
      await navigator.clipboard.writeText(text);
      toast("Demo details copied");
    }
  } catch (e) {
    if (e.name !== "AbortError") toast("Sharing is unavailable in this browser");
  }
}
$("#main").addEventListener(
  "wheel",
  () => {
    historyScrollArmed = true;
  },
  { passive: true },
);
$("#main").addEventListener(
  "touchmove",
  () => {
    historyScrollArmed = true;
  },
  { passive: true },
);
$("#main").addEventListener(
  "scroll",
  () => {
    const el = $("#main");
    if (
      page === "detail" &&
      historyScrollArmed &&
      el.scrollTop > 0 &&
      el.scrollHeight - el.scrollTop - el.clientHeight < 56
    )
      loadMoreTransactions();
  },
  { passive: true },
);
save();
render();
if (document.modelContext?.registerTool) {
  try {
    Promise.resolve(
      document.modelContext.registerTool({
        name: "open_demo_profile_editor",
        title: "Open demo profile editor",
        description: "Open the editor for fictional profile details without saving changes.",
        inputSchema: { type: "object", properties: {}, additionalProperties: false },
        annotations: { readOnlyHint: false },
        execute(input) {
          if (!input || typeof input !== "object" || Object.keys(input).length)
            throw new Error("Expected an empty object");
          if (page === "login") throw new Error("Unlock the demo first");
          profileEditor();
          return { opened: true };
        },
      }),
    ).catch(() => {});
  } catch {}
}

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
